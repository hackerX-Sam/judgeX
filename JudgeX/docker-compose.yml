version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: judgex_db
    environment:
      POSTGRES_USER: judgex_user
      POSTGRES_PASSWORD: judgex_password
      POSTGRES_DB: judgex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: judgex_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
